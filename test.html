<html>
<head>
<style>

body{
background-color: black;
color: #aaaaaa;
padding: 10px;
font-family: "Noto Sans CJK TC";
}

div{
display:flex;
flex-direction: column;
}

div > div{
border: 1px solid #aaaaaa;
border-radius: 4px;
padding: 4px;
max-width: 100px;
min-width: 80px;

}

</style>

</head>

<body style="overflow: hidden">

  <div id="fields">
  </div>


</body>

<script>
var el=document.getElementById("fields");
var arr=[];
arr.push("name");
arr.push("address");
arr.push("email");
arr.push("phone");
arr.push("things");
arr.push("stuff");
arr.push("");
arr.push("values");
arr.push("other stuff");

var tmp="";
for(i in arr){
tmp+="<div>"+arr[i]+"</div>\n";
}
el.innerHTML=tmp;

</script>

</html>
